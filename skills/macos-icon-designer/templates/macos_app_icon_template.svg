<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
        <!-- ========================================== -->
        <!-- 1. APPLE DUAL-TIER DROP SHADOW FILTERS    -->
        <!-- ========================================== -->
        <!-- Canvas Squircle Drop Shadow -->
        <filter id="macos-drop-shadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
            <!-- Contact / Ambient Occlusion Shadow -->
            <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.28" />
            <!-- Diffuse Directional Key Shadow (12 o'clock light) -->
            <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.22" />
        </filter>

        <!-- Foreground Glyph Cast Shadow onto Canvas -->
        <filter id="glyph-depth" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.32" />
            <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.20" />
        </filter>

        <!-- ========================================== -->
        <!-- 2. SPECULAR RIM & BEVEL GRADIENTS          -->
        <!-- ========================================== -->
        <!-- 1px Specular Inset Rim Highlight (Top light reflection) -->
        <linearGradient id="rim-specular" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40" />
            <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
            <stop offset="70%" stop-color="#000000" stop-opacity="0.04" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
        </linearGradient>

        <!-- Glyph Specular Highlight -->
        <linearGradient id="glyph-specular" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
            <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
        </linearGradient>

        <!-- ========================================== -->
        <!-- 3. CANVAS BACKGROUND MATERIAL GRADIENTS    -->
        <!-- ========================================== -->
        <linearGradient id="canvas-bg" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#2563EB" />
            <stop offset="50%" stop-color="#1D4ED8" />
            <stop offset="100%" stop-color="#1E3A8A" />
        </linearGradient>

        <!-- Top Overhead Diffuse Sheen -->
        <radialGradient id="surface-sheen" cx="50%" cy="5%" r="85%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
            <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.0" />
        </radialGradient>

        <!-- ========================================== -->
        <!-- 4. OFFICIAL APPLE SQUIRCLE CLIP PATH       -->
        <!-- ========================================== -->
        <clipPath id="squircle-clip">
            <path d="M 512 100 
                     C 690 100 782 100 847.5 165.5 
                     C 924 242 924 334 924 512 
                     C 924 690 924 782 847.5 858.5 
                     C 782 924 690 924 512 924 
                     C 334 924 242 924 165.5 858.5 
                     C 100 782 100 690 100 512 
                     C 100 334 100 242 165.5 165.5 
                     C 242 100 334 100 512 100 Z" />
        </clipPath>
    </defs>

    <!-- ============================================== -->
    <!-- LAYER 1: BASE CANVAS SQUIRCLE WITH DROP SHADOW -->
    <!-- ============================================== -->
    <path d="M 512 100 
             C 690 100 782 100 847.5 165.5 
             C 924 242 924 334 924 512 
             C 924 690 924 782 847.5 858.5 
             C 782 924 690 924 512 924 
             C 334 924 242 924 165.5 858.5 
             C 100 782 100 690 100 512 
             C 100 334 100 242 165.5 165.5 
             C 242 100 334 100 512 100 Z" 
          fill="url(#canvas-bg)" 
          filter="url(#macos-drop-shadow)" />

    <!-- ============================================== -->
    <!-- LAYER 2: SURFACE TEXTURE & DIFFUSE SHEEN       -->
    <!-- ============================================== -->
    <g clip-path="url(#squircle-clip)">
        <!-- Top ambient sheen -->
        <rect x="100" y="100" width="824" height="824" fill="url(#surface-sheen)" />

        <!-- Bottom rim occlusion shading -->
        <rect x="100" y="780" width="824" height="144" fill="#000000" opacity="0.18" />
    </g>

    <!-- ============================================== -->
    <!-- LAYER 3: 1PX SPECULAR RIM LIGHT (BEVEL)        -->
    <!-- ============================================== -->
    <path d="M 512 100 
             C 690 100 782 100 847.5 165.5 
             C 924 242 924 334 924 512 
             C 924 690 924 782 847.5 858.5 
             C 782 924 690 924 512 924 
             C 334 924 242 924 165.5 858.5 
             C 100 782 100 690 100 512 
             C 100 334 100 242 165.5 165.5 
             C 242 100 334 100 512 100 Z" 
          fill="none" 
          stroke="url(#rim-specular)" 
          stroke-width="1.5" />

    <!-- ============================================== -->
    <!-- LAYER 4: PRIMARY FOREGROUND GLYPH WITH DEPTH   -->
    <!-- ============================================== -->
    <g id="primary-glyph" filter="url(#glyph-depth)">
        <!-- Custom Vector Glyph goes here (centered at 512, 512) -->
        <circle cx="512" cy="512" r="190" fill="#FFFFFF" />
        <circle cx="512" cy="512" r="190" fill="none" stroke="url(#glyph-specular)" stroke-width="2" />
        <path d="M 440 512 L 490 562 L 600 442" fill="none" stroke="#2563EB" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    </g>
</svg>
